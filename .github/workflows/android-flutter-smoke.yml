name: Android Flutter smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Published Android runtime Flutter smoke
    runs-on: ubuntu-latest
    # Two classified DDS attempts may each consume their existing 600s bound;
    # leave setup, finally cleanup and artifact upload outside that budget.
    timeout-minutes: 25
    env:
      ORG_GRADLE_PROJECT_flutterVlessOfficialRuntimeVerification: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check bounded smoke supervision
        run: python3 tool/test_android_flutter_smoke_retry.py
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-linux-hw-accel: false
          script: |
            adb -s emulator-5554 emu gsm data home
            adb -s emulator-5554 shell svc data enable
            adb -s emulator-5554 shell settings put global mobile_data_always_on 1
            (cd example && flutter pub get)
            python3 tool/test_android_flutter_smoke.py --serial emulator-5554
      - name: Preserve smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-flutter-smoke
          path: build/android-flutter-smoke/
