name: Build Apple Xray runtime assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: Canonical ${{ matrix.platform }} Xray 26.10.29
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, macos]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: third_party/xray-mobile/go.sum
      - name: Check file-only producer and packaging guards
        run: |
          python3 tool/test_build_native_routing_cli.py
          python3 tool/test_apple_classic_core.py
          python3 tool/test_package_apple_runtime_release.py
      - name: Build canonical routing-enabled runtime with private H2BUF toolchain
        env:
          PLATFORM: ${{ matrix.platform }}
          GOTOOLCHAIN: go1.27.3
          H2BUF_CAP_KB: '128'
        run: |
          set -euo pipefail
          export BUILD_DIR="$RUNNER_TEMP/xray-$PLATFORM"
          export OUTPUT_XCFRAMEWORK="$GITHUB_WORKSPACE/build/apple-runtime/$PLATFORM/XRay.xcframework"
          mkdir -p "$(dirname "$OUTPUT_XCFRAMEWORK")"
          if [[ "$PLATFORM" == ios ]]; then
            bash ios/build_xray_ios.sh
          else
            bash packages/flutter_vless_macos/macos/build_xray_macos.sh
          fi
          cp "$BUILD_DIR/classic-core-inputs.json" "build/apple-runtime/$PLATFORM/producer.json"
      - name: Exercise the exact iOS simulator runtime and capabilities
        if: matrix.platform == 'ios'
        run: |
          set -euo pipefail
          rm -rf ios/XRay.xcframework
          cp -R build/apple-runtime/ios/XRay.xcframework ios/XRay.xcframework
          SIMULATOR_UDID="$(xcrun simctl create 'Xray canonical runtime' com.apple.CoreSimulator.SimDeviceType.iPhone-16)"
          export SIMULATOR_UDID
          trap 'xcrun simctl shutdown "$SIMULATOR_UDID" || true; xcrun simctl delete "$SIMULATOR_UDID" || true' EXIT
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          REQUIRE_CORE_PREFLIGHT=1 REQUIRE_VPN_ROUTING=1 REQUIRE_DARWIN_INTERFACE_BINDING=1 REQUIRE_MANAGED_SERVICE_LIFETIMES=1 tool/test_ios_privacy_runtime.sh
      - name: Exercise the exact macOS runtime and capabilities
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          rm -rf packages/flutter_vless_macos/macos/XRay.xcframework
          cp -R build/apple-runtime/macos/XRay.xcframework packages/flutter_vless_macos/macos/XRay.xcframework
          REQUIRE_CORE_PREFLIGHT=1 REQUIRE_VPN_ROUTING=1 REQUIRE_DARWIN_INTERFACE_BINDING=1 REQUIRE_MANAGED_SERVICE_LIFETIMES=1 bash tool/test_macos_privacy_runtime.sh
      - name: Verify static exports and architectures, then create release ZIP
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          python3 tool/package_apple_runtime_release.py --platform "$PLATFORM" \
            --framework "build/apple-runtime/$PLATFORM/XRay.xcframework" \
            --preparation "build/apple-runtime/$PLATFORM/producer.json" \
            --output "build/apple-runtime-artifact/$PLATFORM" --head "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: xray-${{ matrix.platform }}-v26.10.29-${{ github.sha }}-${{ github.run_id }}
          path: |
            build/apple-runtime-artifact/${{ matrix.platform }}/XRay.xcframework.zip
            build/apple-runtime-artifact/${{ matrix.platform }}/manifest.json
            build/apple-runtime-artifact/${{ matrix.platform }}/SHA256SUMS
            build/apple-runtime/${{ matrix.platform }}/producer.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Preserve synthetic runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xray-${{ matrix.platform }}-runtime-logs-${{ github.run_id }}
          path: build/${{ matrix.platform }}_privacy_runtime_probe/*.log
          if-no-files-found: ignore
          retention-days: 14
