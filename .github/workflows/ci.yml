name: CI

on:
  workflow_dispatch:
    inputs:
      validation:
        description: Validation scope
        type: choice
        default: all
        options:
          - all
          - android-emulator
          - apple-runtime
          - apple-host-policy
          - apple-fakedns
          - core-dns-context
          - native-config
          - native-listeners
          - preparation-report
          - apple-windows
          - apple-android
          - acceptance-tools
      apple_runner:
        description: Apple runner for manual validation
        type: choice
        default: macos-latest
        options:
          - macos-latest
          - macos-15-intel
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  apple-host-policy:
    if: github.event_name == 'workflow_dispatch' && inputs.validation == 'apple-host-policy'
    name: Apple host startup policy
    runs-on: ${{ inputs.apple_runner || 'macos-latest' }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Test actual host managers and provider startup with inert boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/apple-host-policy
          bash tool/test_ios_manager_policy.sh 2>&1 | tee build/apple-host-policy/ios-manager.log
          bash tool/test_macos_manager_policy.sh 2>&1 | tee build/apple-host-policy/macos-manager.log
          python3 tool/test_apple_start_owner.py
          python3 tool/test_apple_cold_start_policy.py --receipts
      - name: Preserve synthetic host startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-host-policy-evidence
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/apple-host-policy/*.log
            build/apple-start-owner-current/*.log
            build/apple-start-owner-current/result.json
            build/apple-cold-start-current/*.log
            build/apple-cold-start-current/result.json

  acceptance-tools:
    if: github.event_name != 'workflow_dispatch' || inputs.validation == 'all' || inputs.validation == 'acceptance-tools' || inputs.validation == 'apple-runtime' || inputs.validation == 'apple-windows'
    name: Acceptance timing controls (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test parent-local deadlines and different clock origins
        run: python tool/test_live_acceptance_clock.py -v

  core-dns-context:
    if: github.event_name != 'workflow_dispatch' || inputs.validation == 'all' || inputs.validation == 'core-dns-context' || inputs.validation == 'native-listeners' || inputs.validation == 'preparation-report' || inputs.validation == 'native-config'
    name: Scoped Core DNS runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        with:
          go-version-file: third_party/xray-mobile/go.mod
          cache-dependency-path: third_party/xray-mobile/go.sum
      - name: Test guarded Core lifetime source copies
        run: |
          python tool/test_h3_lifetime_patch.py
          python third_party/xray-native-dns/test_apply.py
          python tool/test_native_dns_preservation_runner.py
          python tool/test_native_vpn_routing_runner.py
      - name: Test Apple lifetime preparation and build provenance
        if: matrix.os == 'macos-latest'
        run: |
          python tool/test_apple_classic_core.py
          python tool/test_build_apple_core_preview.py
      - name: Test unpublished DNS context with actual isolated Core instances
        run: python tool/test_native_dns_context_runtime.py --run-runtime
      - name: Test production preparation with Classic and H3 lifetime cleanup
        run: python tool/test_native_dns_preservation.py --run-runtime
      - name: Test optional VPN routing seam with isolated pinned Core
        run: python tool/test_native_vpn_routing.py --run-runtime
      - name: Test ordinary and optional mobile routing factory
        run: python tool/test_native_routing_factory.py --run-runtime
      - name: Check additive routing CLI builds and private preflight
        run: |
          python tool/test_build_native_routing_cli.py
          python tool/test_native_routing_cli.py
      - name: Check final Apple routing metadata with the shared Core validator
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          NATIVE_CONFIG_VALIDATION: ${{ inputs.validation }}
        run: |
          test_args=(--filter TunnelRoutingMetadataTests)
          if [[ "$NATIVE_CONFIG_VALIDATION" == 'native-config' ]]; then
            test_args=()
          fi
          for platform in ios macos; do
            pair_dir="$RUNNER_TEMP/apple-routing-pair-$platform"
            FLVLESS_EXPORT_ROUTING_PAIR="$pair_dir" bash "tool/test_${platform}_tunnel_support.sh" "${test_args[@]}" > "build/native_routing_cli/apple-$platform-preparation.log" 2>&1
            build/native_routing_cli/optional-xray native-routing check --config "$pair_dir/config.json" --spec "$pair_dir/spec.json" > "build/native_routing_cli/apple-$platform-check.log"
          done
      - name: Check Windows routing metadata with the shared Core validator
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: tool\windows\test_native_routing_spec.cmd
      - name: Test private Android forwarder ownership without TUN
        if: matrix.os == 'ubuntu-latest'
        run: python tool/test_native_tun_preview.py
      - name: Preserve scoped Core DNS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoped-core-dns-${{ matrix.os }}
          path: |
            build/native_dns_context_runtime/*.log
            build/native_dns_context_runtime/result.json
            build/native_dns_preservation/*.log
            build/native_dns_preservation/result.json
            build/native_vpn_routing/*.log
            build/native_vpn_routing/result.json
            build/native_routing_factory/*.log
            build/native_routing_factory/result.json
            build/native_routing_cli/*.log
            build/native_routing_cli/result.json
            build/native_tun_preview/*.jsonl
            build/native_tun_preview/*.log
            build/native_tun_preview/result.json
          if-no-files-found: error
          retention-days: 7

  dart:
    if: github.event_name != 'workflow_dispatch' || inputs.validation == 'all' || inputs.validation == 'preparation-report'
    name: Dart and Flutter tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Use local federated package overrides
        run: |
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            flutter_vless_platform_interface:
              path: packages/flutter_vless_platform_interface
            flutter_vless_android:
              path: packages/flutter_vless_android
            flutter_vless_macos:
              path: packages/flutter_vless_macos
            flutter_vless_windows:
              path: packages/flutter_vless_windows
          YAML
      - name: Install root dependencies
        run: flutter pub get
      - name: Analyze root package
        run: flutter analyze lib test
      - name: Test root package
        run: flutter test
      - name: Analyze and test platform interface package
        working-directory: packages/flutter_vless_platform_interface
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Install Android wrapper package dependencies
        working-directory: packages/flutter_vless_android
        run: |
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            flutter_vless_platform_interface:
              path: ../flutter_vless_platform_interface
          YAML
          flutter pub get
      - name: Analyze Android wrapper package
        working-directory: packages/flutter_vless_android
        run: flutter analyze
      - name: Test Android wrapper package
        working-directory: packages/flutter_vless_android
        run: flutter test
      - name: Analyze and test macOS Dart wrapper package
        working-directory: packages/flutter_vless_macos
        run: |
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            flutter_vless_platform_interface:
              path: ../flutter_vless_platform_interface
          YAML
          flutter pub get
          flutter analyze
          flutter test
      - name: Analyze and test Windows Dart wrapper package
        working-directory: packages/flutter_vless_windows
        run: |
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            flutter_vless_platform_interface:
              path: ../flutter_vless_platform_interface
          YAML
          flutter pub get
          flutter analyze
          flutter test
      - name: Test example routing controls and connection feedback
        working-directory: example
        run: |
          flutter pub get
          flutter analyze lib test
          flutter test

  android-native:
    if: github.event_name != 'workflow_dispatch' || inputs.validation == 'all' || inputs.validation == 'native-listeners' || inputs.validation == 'preparation-report' || inputs.validation == 'apple-android' || inputs.validation == 'native-config'
    name: Android native unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Android SDK platform
        run: |
          sdk_manager_path="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$sdk_manager_path"
          "$sdk_manager_path" "platforms;android-36"
      - name: Build Android runtime local Maven repo
        run: tool/build_android_runtime_maven.sh
      - name: Generate Flutter Android project files
        working-directory: example
        run: flutter pub get
      - name: Run plugin Kotlin unit tests
        env:
          FLVLESS_EXPORT_ROUTING_PAIR: ${{ runner.temp }}/android-routing-pair
        run: python3 tool/with_android_local_runtime.py :flutter_vless_android:testDebugUnitTest --stacktrace
      - uses: actions/setup-go@v6
        with:
          go-version-file: third_party/xray-mobile/go.mod
          cache-dependency-path: third_party/xray-mobile/go.sum
      - name: Check Android routing metadata with the shared Core validator
        run: |
          python3 tool/build_native_routing_cli.py --output build/android-native-routing-check
          build/android-native-routing-check/xray native-routing check --config "$RUNNER_TEMP/android-routing-pair/config.json" --spec "$RUNNER_TEMP/android-routing-pair/spec.json" > build/android-native-routing-check/android-pair-check.log
      - name: Test native Android logical chains and XHTTP TLS with exact Core input
        run: |
          python3 tool/test_android_logical_chain_runtime.py --self-test
          python3 tool/test_android_logical_chain_runtime.py --run-runtime
      - name: Test physical DNS capture verification and fragmented fixture requests
        run: |
          python3 tool/test_verify_android_dns_capture.py
          python3 tool/test_android_dns_fixture.py
          python3 tool/test_android_dns_fixture_diagnostics.py
          python3 tool/test_android_native_dns_fixture.py
          python3 tool/test_verify_android_dns_preview.py
          python3 tool/test_verify_android_tun_preview.py
          python3 tool/test_verify_android_preview_apk.py
          python3 tool/test_android_protection_fixture.py
          python3 tool/test_android_flutter_smoke_retry.py
          python3 tool/test_android_ci_gates.py
          python3 tool/test_android_emulator_failure_capture.py
          python3 tool/test_android_routing_builder.py
          python3 tool/test_android_routing_preview.py
          python3 tool/test_build_android_dns_preview.py
      - name: Verify Maven Central Android runtime resolution
        run: tool/test_android_maven_runtime.sh
      - name: Preserve Android routing metadata checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-routing-metadata
          path: |
            build/android-native-routing-check/*.log
            build/android-native-routing-check/result.json
            build/android_logical_chain_runtime/*.log
            build/android_logical_chain_runtime/result.json
            build/android_logical_chain_runtime/*/metadata.json
            build/android_logical_chain_runtime/xhttp-tls/gradle-export.log
            build/android_logical_chain_runtime/xhttp-tls/*/export/metadata.json
          if-no-files-found: ignore
          retention-days: 7

  android-emulator:
    if: github.event_name != 'workflow_dispatch' || inputs.validation == 'all' || inputs.validation == 'android-emulator' || inputs.validation == 'native-listeners'
    name: Android emulator security and runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: third_party/xray-mobile/go.mod
          cache-dependency-path: third_party/xray-mobile/go.sum
      - name: Test independent mandatory Android CI gates
        run: python3 tool/test_android_ci_gates.py
      - name: Build unpublished Android routing runtime for instrumentation only
        run: |
          sdk_manager_path="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$sdk_manager_path"
          "$sdk_manager_path" "ndk;28.2.13676358"
          python3 tool/build_android_routing_preview.py --output build/android-native-routing-preview --ndk "$ANDROID_SDK_ROOT/ndk/28.2.13676358" --arch x86_64
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-linux-hw-accel: false
          script: |
            adb -s emulator-5554 emu gsm data home
            adb -s emulator-5554 shell svc data enable
            adb -s emulator-5554 shell settings put global mobile_data_always_on 1
            (cd example && flutter pub get)
            python3 tool/run_android_ci_gates.py --serial emulator-5554 --native-routing-preview build/android-native-routing-preview
      - name: Preserve Android security test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-security-emulator
          path: |
            build/android-security-emulator.*/
            build/android-flutter-smoke/
            build/android-ci-gates/result.json
            build/android-separate-uid-results.json
            build/android-native-dns-preview/result.json
            build/android-native-dns-preview/verification.json
            build/android-native-tun-preview/result.json
            build/android-native-tun-preview/verification.json
            build/android-native-routing-preview/result.json
            build/android-native-routing-preview/verification.json
          if-no-files-found: ignore

  apple-fakedns:
    if: github.event_name == 'workflow_dispatch' && inputs.validation == 'apple-fakedns'
    name: Apple FakeDNS on released SDKs (${{ matrix.platform }})
    runs-on: ${{ inputs.apple_runner || 'macos-latest' }}
    timeout-minutes: ${{ matrix.platform == 'ios' && 30 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, macos]
    env:
      APPLE_SDK_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and install checksum-pinned released SDKs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, json, os, re, shutil, subprocess, urllib.request, zipfile
          root = Path.cwd()
          output = root / 'build/apple-fakedns-stock'
          output.mkdir(parents=True)
          records = []
          selected_platform = os.environ['APPLE_SDK_PLATFORM']
          assert selected_platform in {'ios', 'macos'}
          for platform, package, destination in [
              ('ios', 'ios/flutter_vless/Package.swift', 'ios/XRay.xcframework'),
              ('macos', 'packages/flutter_vless_macos/macos/flutter_vless_macos/Package.swift', 'packages/flutter_vless_macos/macos/XRay.xcframework'),
          ]:
              if platform != selected_platform:
                  continue
              text = (root / package).read_text()
              tag = re.search(r'let xrayReleaseTag = "([^"]+)"', text).group(1)
              expected = re.search(r'let xrayChecksum = "([0-9a-f]{64})"', text).group(1)
              assert tag == f'xray-{platform}-v26.10.29'
              url = f'https://github.com/XIIIFOX/flutter_vless/releases/download/{tag}/XRay.xcframework.zip'
              archive = output / f'{platform}.zip'
              with urllib.request.urlopen(url, timeout=90) as response, archive.open('wb') as target:
                  shutil.copyfileobj(response, target)
              actual = hashlib.sha256(archive.read_bytes()).hexdigest()
              assert actual == expected, f'{platform} SDK checksum mismatch'
              with zipfile.ZipFile(archive) as zipped:
                  assert all(not PurePosixPath(name).is_absolute() and '..' not in PurePosixPath(name).parts for name in zipped.namelist())
              extracted = output / platform
              extracted.mkdir()
              subprocess.run(['ditto', '-x', '-k', str(archive), str(extracted)], check=True)
              candidates = [path for path in extracted.rglob('XRay.xcframework') if path.is_dir() and '__MACOSX' not in path.parts]
              assert len(candidates) == 1
              shutil.rmtree(root / destination)
              shutil.copytree(candidates[0], root / destination, symlinks=True)
              records.append(dict(platform=platform, tag=tag, url=url, sha256=actual))
              archive.unlink()
              shutil.rmtree(extracted)
          assert len(records) == 1
          (output / 'sdk-inputs.json').write_text(json.dumps(records, indent=2) + '\n')
          PY
      - name: Test runtime composer isolation
        run: python3 -m unittest discover -s tool -p test_apple_runtime_probe_timeout.py
      - name: Test FakeDNS through the released iOS SDK
        if: matrix.platform == 'ios'
        run: |
          SIMULATOR_UDID="$(xcrun simctl create 'Flutter Vless FakeDNS' com.apple.CoreSimulator.SimDeviceType.iPhone-16)"
          export SIMULATOR_UDID
          trap 'xcrun simctl shutdown "$SIMULATOR_UDID"; xcrun simctl delete "$SIMULATOR_UDID"' EXIT
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          tool/test_ios_privacy_runtime.sh --fakedns-only
      - name: Test FakeDNS through the released macOS SDK
        if: matrix.platform == 'macos'
        run: bash tool/test_macos_privacy_runtime.sh --fakedns-only
      - name: Test shipped HEV packet bridge
        if: matrix.platform == 'macos'
        run: |
          swift package --package-path packages/flutter_vless_macos/macos/flutter_vless_macos resolve
          HEV=packages/flutter_vless_macos/macos/flutter_vless_macos/.build/artifacts/tun2sockskit/HevSocks5Tunnel/HevSocks5Tunnel.xcframework
          bash tool/test_macos_packet_bridge.sh "$HEV/macos-arm64_x86_64"
      - name: Preserve targeted released SDK evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-fakedns-stock-evidence-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: error
          path: |
            build/apple-fakedns-stock/sdk-inputs.json
            build/ios_privacy_runtime_probe/runtime.log
            build/macos_privacy_runtime_probe/runtime.log
            build/macos_packet_bridge_probe/runtime.log

  ios:
    if: github.event_name != 'workflow_dispatch' || inputs.validation == 'all' || inputs.validation == 'apple-runtime' || inputs.validation == 'preparation-report' || inputs.validation == 'apple-windows' || inputs.validation == 'apple-android'
    name: iOS Swift and Xcode build
    runs-on: ${{ inputs.apple_runner || 'macos-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Use local federated package overrides
        run: |
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            flutter_vless_platform_interface:
              path: packages/flutter_vless_platform_interface
            flutter_vless_android:
              path: packages/flutter_vless_android
            flutter_vless_macos:
              path: packages/flutter_vless_macos
            flutter_vless_windows:
              path: packages/flutter_vless_windows
          YAML
      - name: Install root dependencies
        run: flutter pub get
      - name: Test PacketTunnel Swift helper
        run: |
          python3 tool/test_apple_virtual_interface_api.py
          python3 tool/test_apple_cold_start_policy.py --receipts
          python3 tool/test_build_apple_core_preview.py
          python3 tool/test_apple_classic_core.py
          bash tool/test_apple_address_binding.sh
          bash tool/test_apple_routing_spec.sh
          tool/test_ios_tunnel_support.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: third_party/xray-mobile/go.mod
          cache-dependency-path: third_party/xray-mobile/go.sum
      - name: Check shared compatibility corpus against pinned Xray Core
        working-directory: third_party/xray-mobile
        run: go test -count=1 .
      - name: Check mandatory Darwin interface ordering with fake OS faults
        timeout-minutes: 5
        run: |
          python3 tool/test_darwin_interface_bind_patch.py
          python3 tool/test_darwin_interface_bind_semantics_runner.py
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util, json, subprocess
          root=Path.cwd()
          pin=json.loads((root/'third_party/xray-native-dns/pin-manifest.json').read_text())
          metadata=json.loads(subprocess.check_output(['go','mod','download','-json',pin['module']+'@'+pin['module_version']],cwd=root/'third_party/xray-mobile',text=True,timeout=180))
          assert all(metadata.get(k)==pin[v] for k,v in [('Path','module'),('Version','module_version'),('Sum','module_sum')])
          spec=importlib.util.spec_from_file_location('darwin_interface_copier',root/'third_party/xray-vpn-routing/apply.py')
          copier=importlib.util.module_from_spec(spec);spec.loader.exec_module(copier)
          source=Path(metadata['Dir'])
          copier.copy_and_apply_lifetimes(source,root/'build/darwin-interface-binding/Core')
          PY
          python3 tool/test_darwin_interface_bind_semantics.py --core-copy build/darwin-interface-binding/Core --output build/darwin-interface-binding/semantic
      - name: Check optional bridge and build unpublished iOS Core preview
        run: |
          tool/test_apple_core_preflight_bridge.sh
          tool/build_apple_core_preview.sh ios build/apple-core-preview/ios --vpn-routing
          rm -rf ios/XRay.xcframework
          cp -R build/apple-core-preview/ios/XRay.xcframework ios/XRay.xcframework
      - name: Test iOS profile transactions and operation ordering
        run: |
          tool/test_ios_manager_policy.sh
          tool/test_ios_operation_queue.sh
          python3 tool/test_platform_status_dispatch.py
          python3 -m unittest discover -s tool -p test_apple_runtime_probe_timeout.py
      - name: Test strict local proxy transport and TLS rejection
        run: tool/test_ios_local_proxy_transport.sh
      - name: Resolve pinned HEV and verify its authentication configuration
        run: |
          swift package --package-path ios/flutter_vless resolve
          tool/test_ios_hev_auth.sh
      - name: Test real iOS Xray in simulator and link HEV fixture
        timeout-minutes: 18
        run: |
          SIMULATOR_UDID="$(xcrun simctl create 'Flutter Vless Security' com.apple.CoreSimulator.SimDeviceType.iPhone-16)"
          export SIMULATOR_UDID
          trap 'xcrun simctl shutdown "$SIMULATOR_UDID"; xcrun simctl delete "$SIMULATOR_UDID"' EXIT
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          REQUIRE_CORE_PREFLIGHT=1 REQUIRE_VPN_ROUTING=1 REQUIRE_DARWIN_INTERFACE_BINDING=1 tool/test_ios_privacy_runtime.sh
          HEV=ios/flutter_vless/.build/artifacts/tun2sockskit/HevSocks5Tunnel/HevSocks5Tunnel.xcframework
          # The checksum-pinned simulator HEV slice is a link-only stub.
          # Its packet runtime must be checked on a physical iOS device.
          bash tool/test_ios_packet_bridge.sh "$HEV/ios-arm64_x86_64-simulator" --compile-only
          bash tool/test_ios_packet_bridge.sh "$HEV/ios-arm64" --device-compile-only
      - name: Test bounded Apple Xray diagnostics store and typed native options
        run: |
          tool/test_bounded_native_log_store.sh
          tool/test_apple_options.sh
          python3 tool/test_apple_controls_setup.py
      - name: Install example dependencies
        working-directory: example
        run: flutter pub get
      - name: Build example iOS app without codesigning
        working-directory: example
        run: flutter build ios --debug --no-codesign
      - name: Build standalone iOS SwiftPM plugin product
        run: |
          FLUTTER_SDK="$(dirname "$(dirname "$(command -v flutter)")")"
          xcodebuild -workspace example/ios/Runner.xcworkspace -scheme flutter-vless \
            -configuration Debug -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO \
            "FRAMEWORK_SEARCH_PATHS=\$(inherited) $FLUTTER_SDK/bin/cache/artifacts/engine/ios/Flutter.xcframework/ios-arm64" build
      - name: Build unpublished macOS Core preview
        run: |
          tool/build_apple_core_preview.sh macos build/apple-core-preview/macos --vpn-routing
          rm -rf packages/flutter_vless_macos/macos/XRay.xcframework
          cp -R build/apple-core-preview/macos/XRay.xcframework packages/flutter_vless_macos/macos/XRay.xcframework
      - name: Build example macOS app
        working-directory: example
        env:
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: "NO"
        run: |
          flutter build macos --config-only
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - name: Test macOS protection policies, runtime and HEV packets
        timeout-minutes: 15
        run: |
          bash tool/test_macos_tunnel_support.sh
          bash tool/test_macos_manager_policy.sh
          REQUIRE_CORE_PREFLIGHT=1 REQUIRE_VPN_ROUTING=1 REQUIRE_DARWIN_INTERFACE_BINDING=1 bash tool/test_macos_privacy_runtime.sh
          HEV=ios/flutter_vless/.build/artifacts/tun2sockskit/HevSocks5Tunnel/HevSocks5Tunnel.xcframework
          bash tool/test_macos_packet_bridge.sh "$HEV/macos-arm64_x86_64"
      - name: Package the checked unpublished iOS SDK
        run: |
          python3 tool/test_package_apple_core_preview.py
          python3 tool/package_apple_core_preview.py --preview build/apple-core-preview/ios --output build/apple-checked-sdk-artifact --head "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-checked-sdk-${{ github.sha }}-${{ github.run_id }}
          path: |
            build/apple-checked-sdk-artifact/ios-sdk-preview.tar.gz
            build/apple-checked-sdk-artifact/manifest.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Preserve Apple synthetic runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-runtime-evidence
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/apple-virtual-interface-api/result.json
            build/apple-virtual-interface-api/*.swift
            build/apple-virtual-interface-api/*.log
            build/darwin-interface-binding/semantic/source.json
            build/darwin-interface-binding/semantic/semantic-go.log
            build/darwin-interface-binding/semantic/execution.json
            build/ios_privacy_runtime_probe/runtime.log
            build/macos_privacy_runtime_probe/runtime.log
            build/ios_packet_bridge_probe/runtime.log
            build/macos_packet_bridge_probe/runtime.log

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.validation == 'all' || inputs.validation == 'native-listeners' || inputs.validation == 'preparation-report' || inputs.validation == 'apple-windows'
    name: Windows native plugin build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Use local federated package overrides
        shell: bash
        run: |
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            flutter_vless_platform_interface:
              path: packages/flutter_vless_platform_interface
            flutter_vless_android:
              path: packages/flutter_vless_android
            flutter_vless_macos:
              path: packages/flutter_vless_macos
            flutter_vless_windows:
              path: packages/flutter_vless_windows
          YAML
      - name: Build Windows diagnostics store unit test
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /utf-8 /W4 /WX packages\flutter_vless_windows\windows\diagnostics_log.cpp packages\flutter_vless_windows\windows\diagnostics_log_test.cpp /Fe:diagnostics_log_test.exe && diagnostics_log_test.exe
      - name: Build example Windows app
        working-directory: example
        run: |
          flutter pub get
          flutter build windows --debug
      - name: Test Windows native security boundaries
        shell: cmd
        run: tool\windows\build_native_tests.cmd
