name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  dart:
    name: Dart and Flutter tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Use local federated package overrides
        run: |
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            flutter_vless_platform_interface:
              path: packages/flutter_vless_platform_interface
            flutter_vless_android:
              path: packages/flutter_vless_android
            flutter_vless_macos:
              path: packages/flutter_vless_macos
            flutter_vless_windows:
              path: packages/flutter_vless_windows
          YAML
      - name: Install root dependencies
        run: flutter pub get
      - name: Analyze root package
        run: flutter analyze lib test
      - name: Test root package
        run: flutter test
      - name: Install Android wrapper package dependencies
        working-directory: packages/flutter_vless_android
        run: flutter pub get
      - name: Analyze Android wrapper package
        working-directory: packages/flutter_vless_android
        run: flutter analyze
      - name: Test Android wrapper package
        working-directory: packages/flutter_vless_android
        run: flutter test

  android-native:
    name: Android native unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36"
      - name: Build Android runtime local Maven repo
        run: tool/build_android_runtime_maven.sh
      - name: Generate Flutter Android project files
        working-directory: example
        run: flutter pub get
      - name: Run plugin Kotlin unit tests
        working-directory: example/android
        run: ./gradlew :flutter_vless_android:testDebugUnitTest --stacktrace -PflutterVlessAndroidRuntimeRepo="$GITHUB_WORKSPACE/android_runtime/xray_android/build/repo"
      - name: Verify Maven Central Android runtime resolution
        run: tool/test_android_maven_runtime.sh

  android-emulator:
    name: Android emulator Xray runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-linux-hw-accel: false
          script: |
            (cd example && flutter pub get && flutter test integration_test/android_xray_runtime_smoke_test.dart -d emulator-5554)

  ios:
    name: iOS Swift and Xcode build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Use local federated package overrides
        run: |
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            flutter_vless_platform_interface:
              path: packages/flutter_vless_platform_interface
            flutter_vless_android:
              path: packages/flutter_vless_android
            flutter_vless_macos:
              path: packages/flutter_vless_macos
            flutter_vless_windows:
              path: packages/flutter_vless_windows
          YAML
      - name: Install root dependencies
        run: flutter pub get
      - name: Test PacketTunnel Swift helper
        run: tool/test_ios_tunnel_support.sh
      - name: Install example dependencies
        working-directory: example
        run: flutter pub get
      - name: Build example iOS app without codesigning
        working-directory: example
        run: flutter build ios --debug --no-codesign
