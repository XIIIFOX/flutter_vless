name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  core-dns-context:
    name: Scoped Core DNS runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        with:
          go-version-file: third_party/xray-mobile/go.mod
          cache-dependency-path: third_party/xray-mobile/go.sum
      - name: Test unpublished DNS context with actual isolated Core instances
        run: python tool/test_native_dns_context_runtime.py --run-runtime
      - name: Test production DNS preparation with ordinary pinned Core
        run: python tool/test_native_dns_preservation.py --run-runtime
      - name: Test private Android forwarder ownership without TUN
        if: matrix.os == 'ubuntu-latest'
        run: python tool/test_native_tun_preview.py
      - name: Preserve scoped Core DNS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoped-core-dns-${{ matrix.os }}
          path: |
            build/native_dns_context_runtime/*.log
            build/native_dns_context_runtime/result.json
            build/native_dns_preservation/*.log
            build/native_dns_preservation/result.json
            build/native_tun_preview/*.jsonl
            build/native_tun_preview/*.log
            build/native_tun_preview/result.json
          if-no-files-found: error
          retention-days: 7

  dart:
    name: Dart and Flutter tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Use local federated package overrides
        run: |
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            flutter_vless_platform_interface:
              path: packages/flutter_vless_platform_interface
            flutter_vless_android:
              path: packages/flutter_vless_android
            flutter_vless_macos:
              path: packages/flutter_vless_macos
            flutter_vless_windows:
              path: packages/flutter_vless_windows
          YAML
      - name: Install root dependencies
        run: flutter pub get
      - name: Analyze root package
        run: flutter analyze lib test
      - name: Test root package
        run: flutter test
      - name: Analyze and test platform interface package
        working-directory: packages/flutter_vless_platform_interface
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Install Android wrapper package dependencies
        working-directory: packages/flutter_vless_android
        run: |
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            flutter_vless_platform_interface:
              path: ../flutter_vless_platform_interface
          YAML
          flutter pub get
      - name: Analyze Android wrapper package
        working-directory: packages/flutter_vless_android
        run: flutter analyze
      - name: Test Android wrapper package
        working-directory: packages/flutter_vless_android
        run: flutter test
      - name: Analyze and test macOS Dart wrapper package
        working-directory: packages/flutter_vless_macos
        run: |
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            flutter_vless_platform_interface:
              path: ../flutter_vless_platform_interface
          YAML
          flutter pub get
          flutter analyze
          flutter test
      - name: Analyze and test Windows Dart wrapper package
        working-directory: packages/flutter_vless_windows
        run: |
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            flutter_vless_platform_interface:
              path: ../flutter_vless_platform_interface
          YAML
          flutter pub get
          flutter analyze
          flutter test

  android-native:
    name: Android native unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Android SDK platform
        run: |
          sdk_manager_path="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$sdk_manager_path"
          "$sdk_manager_path" "platforms;android-36"
      - name: Build Android runtime local Maven repo
        run: tool/build_android_runtime_maven.sh
      - name: Generate Flutter Android project files
        working-directory: example
        run: flutter pub get
      - name: Run plugin Kotlin unit tests
        run: python3 tool/with_android_local_runtime.py :flutter_vless_android:testDebugUnitTest --stacktrace
      - name: Test physical DNS capture verification and fragmented fixture requests
        run: |
          python3 tool/test_verify_android_dns_capture.py
          python3 tool/test_android_dns_fixture.py
          python3 tool/test_android_dns_fixture_diagnostics.py
          python3 tool/test_android_native_dns_fixture.py
          python3 tool/test_verify_android_dns_preview.py
          python3 tool/test_verify_android_tun_preview.py
          python3 tool/test_verify_android_preview_apk.py
          python3 tool/test_android_protection_fixture.py
          python3 tool/test_android_flutter_smoke_retry.py
          python3 tool/test_android_emulator_failure_capture.py
      - name: Verify Maven Central Android runtime resolution
        run: tool/test_android_maven_runtime.sh

  android-emulator:
    name: Android emulator security and runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-linux-hw-accel: false
          script: |
            adb -s emulator-5554 emu gsm data home
            adb -s emulator-5554 shell svc data enable
            adb -s emulator-5554 shell settings put global mobile_data_always_on 1
            (cd example && flutter pub get)
            python3 tool/test_android_flutter_smoke.py --serial emulator-5554
            ANDROID_SERIAL=emulator-5554 tool/test_android_security_emulator.sh --no-capture
            python3 tool/test_android_separate_uid.py --serial emulator-5554 --output build/android-separate-uid-results.json
      - name: Preserve Android security test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-security-emulator
          path: |
            build/android-security-emulator.*/
            build/android-flutter-smoke/
            build/android-separate-uid-results.json
            build/android-native-dns-preview/result.json
            build/android-native-dns-preview/verification.json
            build/android-native-tun-preview/result.json
            build/android-native-tun-preview/verification.json
          if-no-files-found: ignore

  ios:
    name: iOS Swift and Xcode build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Use local federated package overrides
        run: |
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            flutter_vless_platform_interface:
              path: packages/flutter_vless_platform_interface
            flutter_vless_android:
              path: packages/flutter_vless_android
            flutter_vless_macos:
              path: packages/flutter_vless_macos
            flutter_vless_windows:
              path: packages/flutter_vless_windows
          YAML
      - name: Install root dependencies
        run: flutter pub get
      - name: Test PacketTunnel Swift helper
        run: |
          bash tool/test_apple_address_binding.sh
          tool/test_ios_tunnel_support.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: third_party/xray-mobile/go.mod
          cache-dependency-path: third_party/xray-mobile/go.sum
      - name: Check shared compatibility corpus against pinned Xray Core
        working-directory: third_party/xray-mobile
        run: go test -count=1 .
      - name: Check optional bridge and build unpublished iOS Core preview
        run: |
          tool/test_apple_core_preflight_bridge.sh
          tool/build_apple_core_preview.sh ios build/apple-core-preview/ios
          rm -rf ios/XRay.xcframework
          cp -R build/apple-core-preview/ios/XRay.xcframework ios/XRay.xcframework
      - name: Test iOS profile transactions and operation ordering
        run: |
          tool/test_ios_manager_policy.sh
          tool/test_ios_operation_queue.sh
          python3 tool/test_platform_status_dispatch.py
          python3 -m unittest discover -s tool -p test_apple_runtime_probe_timeout.py
      - name: Test strict local proxy transport and TLS rejection
        run: tool/test_ios_local_proxy_transport.sh
      - name: Resolve pinned HEV and verify its authentication configuration
        run: |
          swift package --package-path ios/flutter_vless resolve
          tool/test_ios_hev_auth.sh
      - name: Test real iOS Xray in simulator and link HEV fixture
        timeout-minutes: 18
        run: |
          SIMULATOR_UDID="$(xcrun simctl create 'Flutter Vless Security' com.apple.CoreSimulator.SimDeviceType.iPhone-16)"
          export SIMULATOR_UDID
          trap 'xcrun simctl shutdown "$SIMULATOR_UDID"; xcrun simctl delete "$SIMULATOR_UDID"' EXIT
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          REQUIRE_CORE_PREFLIGHT=1 tool/test_ios_privacy_runtime.sh
          HEV=ios/flutter_vless/.build/artifacts/tun2sockskit/HevSocks5Tunnel/HevSocks5Tunnel.xcframework
          # The checksum-pinned simulator HEV slice is a link-only stub.
          # Its packet runtime must be checked on a physical iOS device.
          bash tool/test_ios_packet_bridge.sh "$HEV/ios-arm64_x86_64-simulator" --compile-only
          bash tool/test_ios_packet_bridge.sh "$HEV/ios-arm64" --device-compile-only
      - name: Test bounded Apple Xray diagnostics store and typed native options
        run: |
          tool/test_bounded_native_log_store.sh
          tool/test_apple_options.sh
          python3 tool/test_apple_controls_setup.py
      - name: Install example dependencies
        working-directory: example
        run: flutter pub get
      - name: Build example iOS app without codesigning
        working-directory: example
        run: flutter build ios --debug --no-codesign
      - name: Build standalone iOS SwiftPM plugin product
        run: |
          FLUTTER_SDK="$(dirname "$(dirname "$(command -v flutter)")")"
          xcodebuild -workspace example/ios/Runner.xcworkspace -scheme flutter-vless \
            -configuration Debug -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO \
            "FRAMEWORK_SEARCH_PATHS=\$(inherited) $FLUTTER_SDK/bin/cache/artifacts/engine/ios/Flutter.xcframework/ios-arm64" build
      - name: Build unpublished macOS Core preview
        run: |
          tool/build_apple_core_preview.sh macos build/apple-core-preview/macos
          rm -rf packages/flutter_vless_macos/macos/XRay.xcframework
          cp -R build/apple-core-preview/macos/XRay.xcframework packages/flutter_vless_macos/macos/XRay.xcframework
      - name: Build example macOS app
        working-directory: example
        env:
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: "NO"
        run: |
          flutter build macos --config-only
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - name: Test macOS protection policies, runtime and HEV packets
        timeout-minutes: 15
        run: |
          bash tool/test_macos_tunnel_support.sh
          bash tool/test_macos_manager_policy.sh
          REQUIRE_CORE_PREFLIGHT=1 bash tool/test_macos_privacy_runtime.sh
          HEV=ios/flutter_vless/.build/artifacts/tun2sockskit/HevSocks5Tunnel/HevSocks5Tunnel.xcframework
          bash tool/test_macos_packet_bridge.sh "$HEV/macos-arm64_x86_64"
      - name: Preserve Apple synthetic runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-runtime-evidence
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ios_privacy_runtime_probe/runtime.log
            build/macos_privacy_runtime_probe/runtime.log
            build/ios_packet_bridge_probe/runtime.log
            build/macos_packet_bridge_probe/runtime.log

  windows:
    name: Windows native plugin build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Use local federated package overrides
        shell: bash
        run: |
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            flutter_vless_platform_interface:
              path: packages/flutter_vless_platform_interface
            flutter_vless_android:
              path: packages/flutter_vless_android
            flutter_vless_macos:
              path: packages/flutter_vless_macos
            flutter_vless_windows:
              path: packages/flutter_vless_windows
          YAML
      - name: Build Windows diagnostics store unit test
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /utf-8 /W4 /WX packages\flutter_vless_windows\windows\diagnostics_log.cpp packages\flutter_vless_windows\windows\diagnostics_log_test.cpp /Fe:diagnostics_log_test.exe && diagnostics_log_test.exe
      - name: Build example Windows app
        working-directory: example
        run: |
          flutter pub get
          flutter build windows --debug
      - name: Test Windows native security boundaries
        shell: cmd
        run: tool\windows\build_native_tests.cmd
