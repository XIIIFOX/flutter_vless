name: Windows project setup

on:
  workflow_dispatch:
    inputs:
      live_runtime:
        description: Exercise elevated proxy and VPN after the clean project builds
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows-consumer:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Require an elevated token and build the network observer
        if: inputs.live_runtime
        shell: pwsh
        run: |
          $principal = [Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent())
          if (!$principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'Windows runtime verification requires an elevated token'
          }
          auditpol /set /subcategory:"{0CCE9226-69AE-11D9-BED3-505054503030}" /failure:enable
          if ($LASTEXITCODE) { throw 'Cannot enable native WFP block evidence' }
          & cmd.exe /d /c 'tool\windows\build_runtime_probe.cmd build\windows-project-setup'
          if ($LASTEXITCODE) { throw 'Could not build the native network observer' }
      - name: Verify setup, doctor, and MSVC builds on fresh proxy and VPN apps
        env:
          FLUTTER_VLESS_WINDOWS_LIVE_PROBE: ${{ inputs.live_runtime && 'build/windows-project-setup/runtime_probe.exe' || '' }}
        run: python tool/test_project_setup.py -v ProjectSetupTest.test_windows_published_runtime_and_build
