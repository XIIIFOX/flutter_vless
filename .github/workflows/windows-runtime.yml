name: Windows runtime validation

on:
  workflow_dispatch:
    inputs:
      validation:
        description: Validation scope
        type: choice
        options: [all, numeric-ipv6]
        default: all
  push:
    branches: [fr/windows-runtime-validation, fr/windows-security-1.1.6]

permissions:
  contents: read

concurrency:
  group: windows-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-proxy:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check routing fixture isolation
        run: |
          python tool/windows/test_runtime_fixtures.py
          python tool/windows/test_package_managed_runtime.py
      - name: Record toolchain and operating system
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/windows-runtime | Out-Null
          Get-ComputerInfo | Select-Object WindowsProductName,WindowsVersion,OsBuildNumber | ConvertTo-Json | Out-File build/windows-runtime/environment.log
          whoami /groups | Out-File -Append build/windows-runtime/environment.log
      - name: Download and verify the pinned Windows runtime
        shell: pwsh
        run: |
          $url = 'https://github.com/XTLS/Xray-core/releases/download/v26.10.29/Xray-windows-64.zip'
          Invoke-WebRequest $url -OutFile build/xray-windows.zip
          if ((Get-FileHash build/xray-windows.zip -Algorithm SHA256).Hash.ToLower() -ne 'fce33e81cccf50e7aab572b175519a50b5e0f9d2f5c8d1ed73012ea5c9ad4d58') { throw 'Xray checksum mismatch' }
          Expand-Archive build/xray-windows.zip build/windows-runtime -Force
          # Runtime-only update: retain the project's full GeoDAT, not the upstream lite bundle.
          Copy-Item android_runtime/xray_android/src/main/assets/geoip.dat,android_runtime/xray_android/src/main/assets/geosite.dat build/windows-runtime -Force
          Get-FileHash android_runtime/xray_android/src/main/assets/geoip.dat,android_runtime/xray_android/src/main/assets/geosite.dat | Format-Table | Out-File build/windows-runtime/project-geodata-checksums.log
          Copy-Item example/windows/xray/tun2socks.exe,example/windows/xray/wintun.dll build/windows-runtime
          Copy-Item build/windows-runtime/xray.exe build/windows-runtime/xray-official.exe
          Get-FileHash build/windows-runtime/*.exe,build/windows-runtime/*.dll,build/windows-runtime/*.dat | Format-Table | Out-File build/windows-runtime/binary-checksums.log
          $version = @(& build/windows-runtime/xray.exe version)
          if ($LASTEXITCODE) { throw 'Xray version failed' }
          $version | Tee-Object -FilePath build/windows-runtime/official-version.log
          if ($version.Count -lt 1 -or $version[0] -notmatch '^Xray 26\.10\.29(?:\s|$)') { throw 'Unexpected pinned Xray version' }
      - uses: actions/setup-go@v6
        with:
          go-version-file: third_party/xray-mobile/go.mod
          cache-dependency-path: third_party/xray-mobile/go.sum
      - name: Build unpublished routing runtime for this validation
        shell: pwsh
        run: |
          python tool/build_native_routing_cli.py --output build/windows-routing-preview
          if ($LASTEXITCODE) { throw 'Optional routing runtime build failed' }
          Copy-Item build/windows-routing-preview/xray.exe build/windows-runtime/xray.exe -Force
          Copy-Item build/windows-routing-preview/result.json build/windows-runtime/native-routing-build-results.json
          Get-FileHash build/windows-runtime/xray.exe | Format-Table | Out-File -Append build/windows-runtime/binary-checksums.log
      - name: Build and run native configuration, WFP policy, process and ACL tests
        shell: cmd
        run: |
          call tool\windows\build_native_tests.cmd > build\windows-runtime\native-tests.log 2>&1
          set "native_result=%ERRORLEVEL%"
          type build\windows-runtime\native-tests.log
          exit /b %native_result%
      - name: Require real Windows privilege checks
        shell: pwsh
        run: |
          $log = Get-Content build/windows-runtime/native-tests.log -Raw
          if ($log -match 'SKIP') { throw 'A required native Windows test was skipped' }
          if ([regex]::Matches($log, '(?m)^WINDOWS_STATIC_DNS_ALIAS_PASS=4\r?$').Count -ne 1) { throw 'Static DNS alias preparation controls missing or duplicated' }
          if ($log -notmatch 'deny filtered same-user') { throw 'Filtered-token boundary was not tested' }
          if ($log -notmatch 'PASS pinned Core preflight') { throw 'Pinned Core preflight was not tested' }
          if ($log -notmatch 'PASS administrator-only Core preflight') { throw 'Administrator-only Core preflight was not tested' }
          if ($log -notmatch 'WINDOWS_FINAL_CONFIG_PREFLIGHT_PASS=2') { throw 'Exact final VPN configuration preflight was not tested' }
          if ($log -notmatch 'WINDOWS_ROUTING_ADOPTION_PURE_PASS=36') { throw 'Native routing adoption controls were not tested' }
          if ($log -notmatch 'WINDOWS_ROUTING_PARENT_STDIN_PASS=1') { throw 'Owned routing parent pipe lifecycle was not tested' }
          if ($log -notmatch 'WINDOWS_PRIVATE_PORT_ADMISSION_PURE_PASS=8') { throw 'Bounded private TCP port admission was not tested' }
          if ($log -notmatch 'WINDOWS_PRIVATE_PORT_AVAILABILITY_PASS=2') { throw 'Occupied TCP listener availability was not tested' }
          if ($log -notmatch 'WINDOWS_PACKET_PROBE_SOURCE_GUARD_PASS=4') { throw 'Actual packet-probe allocation source was not tested' }
          if ($log -notmatch 'WINDOWS_PACKET_PROBE_EXCLUSION_PURE_PASS=8') { throw 'Packet-probe listener exclusion and cleanup were not tested' }
          if ($log -notmatch 'WINDOWS_TRAFFIC_SOURCE_GUARD_PASS=4') { throw 'Actual traffic consumer wiring was not tested' }
          if ($log -notmatch 'WINDOWS_TRAFFIC_WIRE_PASS=11') { throw 'Shared Core counter wire cases were not tested' }
          if ($log -notmatch 'WINDOWS_TRAFFIC_CONSUMER_PASS=12') { throw 'Owned counter selection and status lifecycle were not tested' }
      - name: Require numeric IPv6 native controls and bind compiled inputs
        shell: pwsh
        run: |
          python tool/windows/test_numeric_ipv6_qualification.py
          if ($LASTEXITCODE) { throw 'Numeric IPv6 qualification guards failed' }
          $log = Get-Content build/windows-runtime/native-tests.log -Raw
          foreach ($marker in @('WINDOWS_NUMERIC_IPV6_CALLERS_PASS=8', 'WINDOWS_NUMERIC_IPV6_PEER_CODEC_PASS=1', 'WINDOWS_NUMERIC_IPV6_PREPARATION_PASS=1', 'WINDOWS_NUMERIC_IPV6_UNDERLAY_PASS=1', 'WINDOWS_NUMERIC_IPV6_WFP_PASS=1')) {
            if ([regex]::Matches($log, '(?m)^' + [regex]::Escape($marker) + '\r?$').Count -ne 1) { throw 'Numeric IPv6 native controls missing or duplicated' }
          }
          python tool/windows/verify_numeric_ipv6_qualification.py --directory build/windows-runtime --record-build
          if ($LASTEXITCODE) { throw 'Numeric IPv6 compiled-input binding failed' }
      - name: Verify gateway selection through Windows APIs
        shell: pwsh
        run: |
          $gateway = & build/windows-runtime/runtime_probe.exe gateway
          if ($LASTEXITCODE) { throw 'Native gateway lookup failed' }
          $expected = (Find-NetRoute -RemoteIPAddress 8.8.8.8 | Where-Object { $_.DestinationPrefix }).NextHop
          if ($gateway.Trim() -notin $expected) { throw 'Native gateway differs from Windows routing API' }
      - name: Exercise real Xray domain routing and reverse controls
        shell: pwsh
        run: |
          python tool/windows/runtime_smoke.py --directory build/windows-runtime 2>&1 | Tee-Object -FilePath build/windows-runtime/proxy-traffic-runtime.log
          if ($LASTEXITCODE) { throw 'Proxy runtime acceptance failed' }
          $log = Get-Content build/windows-runtime/proxy-traffic-runtime.log -Raw
          if ([regex]::Matches($log, '(?m)^WINDOWS_TRAFFIC_COUNTER_RUNTIME_PASS=2\r?$').Count -ne 1) { throw 'Proxy owned-counter acceptance is incomplete' }
      - name: Exercise portable nested runtime and a Unicode path
        shell: pwsh
        run: |
          $portable = Join-Path $env:RUNNER_TEMP 'Vless Space Ω/Portable'
          New-Item -ItemType Directory -Force "$portable/xray" | Out-Null
          Copy-Item build/windows-runtime/runtime_probe.exe $portable
          Copy-Item build/windows-runtime/xray.exe,build/windows-runtime/geoip.dat,build/windows-runtime/geosite.dat,build/windows-runtime/tun2socks.exe,build/windows-runtime/wintun.dll "$portable/xray"
          python tool/windows/runtime_smoke.py --directory $portable 2>&1 | Tee-Object -FilePath build/windows-runtime/portable-traffic-runtime.log
          if ($LASTEXITCODE) { throw 'Portable routing failed' }
          $log = Get-Content build/windows-runtime/portable-traffic-runtime.log -Raw
          if ([regex]::Matches($log, '(?m)^WINDOWS_TRAFFIC_COUNTER_RUNTIME_PASS=2\r?$').Count -ne 1) { throw 'Portable owned-counter acceptance is incomplete' }
          Copy-Item "$portable/proxy-results.json" build/windows-runtime/portable-results.json
      - name: Package the exact managed Core after reverse routing and cleanup checks
        shell: pwsh
        run: |
          python tool/windows/package_managed_runtime.py --directory build/windows-runtime `
            --producer build/windows-routing-preview/result.json --output build/windows-managed-runtime --head "$env:GITHUB_SHA"
          if ($LASTEXITCODE) { throw 'Managed runtime packaging failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-managed-${{ matrix.os }}-${{ github.sha }}-${{ github.run_id }}
          path: build/windows-managed-runtime/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-runtime-${{ matrix.os }}
          path: |
            build/windows-runtime/*.exe
            build/windows-runtime/*.dll
            build/windows-runtime/*.dat
            build/windows-runtime/*.log
            build/windows-runtime/*results.json
          retention-days: 7

  example-build:
    needs: build-and-proxy
    if: ${{ inputs.validation != 'numeric-ipv6' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: windows-runtime-${{ matrix.os }}
          path: build/windows-runtime
      - name: Test example and Windows wrapper
        shell: pwsh
        run: |
          Push-Location example
          flutter pub get
          if ($LASTEXITCODE) { throw 'Example dependencies failed' }
          flutter test test/widget_test.dart
          if ($LASTEXITCODE) { throw 'Example diagnostics test failed' }
          Pop-Location
          Push-Location packages/flutter_vless_windows
          @'
          dependency_overrides:
            flutter_vless_platform_interface:
              path: ../flutter_vless_platform_interface
          '@ | Set-Content pubspec_overrides.yaml
          flutter pub get
          if ($LASTEXITCODE) { throw 'Wrapper dependencies failed' }
          flutter analyze
          if ($LASTEXITCODE) { throw 'Wrapper analysis failed' }
          flutter test
          if ($LASTEXITCODE) { throw 'Wrapper tests failed' }
          Pop-Location
      - name: Build example Windows application with MSVC
        working-directory: example
        run: flutter build windows --release
      - name: Bundle the verified native runtime
        shell: pwsh
        run: |
          $bundle = 'example/build/windows/x64/runner/Release'
          New-Item -ItemType Directory -Force "$bundle/xray" | Out-Null
          Copy-Item build/windows-runtime/xray.exe,build/windows-runtime/geoip.dat,build/windows-runtime/geosite.dat,build/windows-runtime/tun2socks.exe,build/windows-runtime/wintun.dll "$bundle/xray"
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $crt = Get-ChildItem "$vs/VC/Redist/MSVC/*/x64/Microsoft.VC*.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$crt) { throw 'MSVC runtime directory unavailable' }
          Copy-Item "$($crt.FullName)/*.dll" $bundle
      - uses: actions/upload-artifact@v4
        with:
          name: windows-example-1.1.7-${{ matrix.os }}
          path: example/build/windows/x64/runner/Release
          retention-days: 7

  vpn-routing:
    needs: build-and-proxy
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: windows-runtime-${{ matrix.os }}
          path: build/windows-runtime
      - name: Record Windows network baseline
        shell: pwsh
        run: |
          Get-NetRoute | Format-Table | Out-File build/windows-runtime/routes-before.log
          Get-NetIPInterface | Format-Table | Out-File build/windows-runtime/interfaces-before.log
          # Language-independent audit subcategory: Filtering Platform Connection.
          auditpol /set /subcategory:"{0CCE9226-69AE-11D9-BED3-505054503030}" /failure:enable
          if ($LASTEXITCODE) { throw 'Cannot enable native WFP block evidence' }
      - name: Exercise native WFP, Wintun, routing, DNS and recovery
        if: ${{ inputs.validation != 'numeric-ipv6' }}
        shell: pwsh
        run: |
          python tool/windows/runtime_smoke.py --directory build/windows-runtime --vpn --native-routing 2>&1 | Tee-Object -FilePath build/windows-runtime/native-routing-runtime.log
          if ($LASTEXITCODE) { throw 'Native VPN runtime acceptance failed' }
      - name: Require native routing traffic and recovery
        if: ${{ inputs.validation != 'numeric-ipv6' }}
        shell: pwsh
        run: |
          $log = Get-Content build/windows-runtime/native-routing-runtime.log -Raw
          if ($log -notmatch 'WINDOWS_NATIVE_ROUTING_TRAFFIC_PASS=2') { throw 'Native routing traffic proof is incomplete' }
          if ($log -notmatch 'WINDOWS_PRIVATE_PORT_OCCUPIED_RUNTIME_PASS=2') { throw 'VPN traffic with occupied preferred TCP ports was not tested' }
          if ([regex]::Matches($log, '(?m)^WINDOWS_TRAFFIC_COUNTER_RUNTIME_PASS=4\r?$').Count -ne 1) { throw 'VPN owned-counter acceptance is incomplete' }
          if ([regex]::Matches($log, '(?m)^WINDOWS_FAKEDNS_RUNTIME_PASS=2\r?$').Count -ne 1) { throw 'FakeDNS TCP/UDP and restart acceptance is incomplete' }
      - name: Exercise numeric IPv6 routing runtime
        if: ${{ inputs.validation == 'numeric-ipv6' }}
        shell: pwsh
        run: |
          python tool/windows/runtime_smoke.py --directory build/windows-runtime --vpn --numeric-ipv6-only --numeric-ipv6-variant routing 2>&1 | Tee-Object -FilePath build/windows-runtime/native-routing-runtime.log
          if ($LASTEXITCODE) { throw 'Numeric IPv6 routing-runtime acceptance failed' }
      - name: Qualify numeric IPv6 routing runtime evidence
        shell: pwsh
        run: |
          python tool/windows/verify_numeric_ipv6_qualification.py --directory build/windows-runtime --variant routing
          if ($LASTEXITCODE) { throw 'Numeric IPv6 routing-runtime proof is incomplete' }
      - name: Exercise numeric IPv6 with the verified official runtime
        shell: pwsh
        run: |
          $ordinary = 'build/windows-runtime/numeric-ipv6-official'
          if (Test-Path $ordinary) { throw 'Numeric IPv6 ordinary directory already exists' }
          New-Item -ItemType Directory $ordinary | Out-Null
          Copy-Item build/windows-runtime/runtime_probe.exe,build/windows-runtime/tun2socks.exe,build/windows-runtime/wintun.dll,build/windows-runtime/geoip.dat,build/windows-runtime/geosite.dat,build/windows-runtime/numeric-ipv6-build-results.json $ordinary
          Copy-Item build/windows-runtime/xray-official.exe "$ordinary/xray.exe"
          python tool/windows/runtime_smoke.py --directory $ordinary --vpn --numeric-ipv6-only --numeric-ipv6-variant official 2>&1 | Tee-Object -FilePath "$ordinary/numeric-ipv6-runtime.log"
          if ($LASTEXITCODE) { throw 'Numeric IPv6 official-runtime acceptance failed' }
          python tool/windows/verify_numeric_ipv6_qualification.py --directory $ordinary --variant official --log numeric-ipv6-runtime.log
          if ($LASTEXITCODE) { throw 'Numeric IPv6 official-runtime proof is incomplete' }
      - name: Restore the disposable runner after any failure
        if: always()
        shell: pwsh
        run: |
          Get-Process xray,tun2socks,runtime_probe -ErrorAction SilentlyContinue | Stop-Process -Force
          & build/windows-runtime/runtime_probe.exe release-protection
          if ($LASTEXITCODE) { throw 'Failed to release the test WFP policy' }
          Get-NetRoute -InterfaceAlias flutter_vless_tun -ErrorAction SilentlyContinue | Remove-NetRoute -Confirm:$false -ErrorAction Continue
          Get-NetRoute | Format-Table | Out-File build/windows-runtime/routes-after.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-vpn-results-${{ matrix.os }}
          path: |
            build/windows-runtime/*.log
            build/windows-runtime/*results.json
            build/windows-runtime/numeric-ipv6-official/*.log
            build/windows-runtime/numeric-ipv6-official/*results.json
            build/windows-runtime/numeric-ipv6-*/peer.log
            build/windows-runtime/numeric-ipv6-*/service.log
            build/windows-runtime/numeric-ipv6-official/numeric-ipv6-*/peer.log
            build/windows-runtime/numeric-ipv6-official/numeric-ipv6-*/service.log
          retention-days: 7
