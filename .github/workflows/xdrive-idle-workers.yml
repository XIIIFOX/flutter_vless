name: XDRIVE idle Core shutdown diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  idle-core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: third_party/xray-mobile/go.sum
      - name: Check diagnostic boundaries without Core execution
        run: python3 tool/test_xdrive_idle_core_runner.py
      - name: Observe actual Core shutdown with a controlled idle cloud transport
        run: python3 tool/test_xdrive_idle_core_runtime.py --run-runtime
      - name: Preserve exact diagnostic outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xdrive-idle-core-diagnostic
          path: |
            build/xdrive_idle_core_runtime/*.json
            build/xdrive_idle_core_runtime/*.log
          if-no-files-found: error
          retention-days: 7
